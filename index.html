<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#edf0e8">
<title>MEDIFLOW｜3D 膠囊分藥機</title>
<style>
:root{color-scheme:light;--ink:#1c2925;--muted:#4c6058;--bg:#edf0e8;--paper:#f9faf5;--edge:#c5d1c6;--accent:#145145;--tint:#e0eae1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans CJK TC",sans-serif;line-height:1.5}
main,header{max-width:1480px;margin:auto;padding-inline:clamp(16px,4vw,58px)}
header>div{min-height:62px;border-bottom:1px solid #a4b7aa;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 .93rem Bahnschrift,"Trebuchet MS",sans-serif;letter-spacing:.2em}
h1{font-size:clamp(2rem,3.7vw,3.2rem);letter-spacing:-.055em;line-height:1.1;margin:27px 0 20px}
h2{font-size:1.08rem;margin:0}
a{color:var(--accent)}
button{color:inherit;font:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible,canvas:focus-visible{outline:3px solid #147c65;outline-offset:2px}
.dashboard{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,310px);gap:16px;align-items:start;margin-bottom:28px}
.viewer,.panel{background:var(--paper);border:1px solid var(--edge);border-radius:9px;overflow:hidden}
.stage{position:relative;min-height:365px;height:clamp(365px,42vw,620px);background:#d9e4dc}
.stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.hud{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
.hud span,.hud button,.zoom button{font-size:.8rem;padding:6px 10px;border:1px solid #96aa9c;border-radius:4px;background:#f9faf5;color:#284d3e}
.hud button,.zoom button{pointer-events:auto}
.hud button[aria-pressed=true]{background:var(--accent);color:white}
.zoom{position:absolute;display:flex;gap:5px;right:14px;bottom:14px}
.zoom button{font-size:1rem;min-width:35px;padding:2px 6px}
.zoom .height{font-size:.76rem}
.hotspots{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hotspot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;min-width:28px;min-height:28px;padding:2px 7px;border:1px solid #527769;border-radius:16px;background:#f9faf5;color:#174c40;font-size:.76rem;font-weight:700;white-space:nowrap;box-shadow:0 1px 5px #203d3b30}
.hotspot:hover,.hotspot:focus-visible,.hotspot[aria-current=true]{background:var(--accent);color:#fff}
.hotspot[aria-current=true]{box-shadow:0 0 0 3px #246e5480}
#loading{position:absolute;inset:45% 12% auto;text-align:center;color:#1b5143;pointer-events:none}
.views{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--edge)}
.views button{font-size:.9rem;font-weight:700;padding:11px 4px;border:0;border-bottom:3px solid transparent;background:transparent}
.views button:hover{background:var(--tint)}
.views button[aria-pressed=true]{background:var(--tint);border-bottom-color:var(--accent);color:var(--accent)}
.caption{padding:12px 14px;color:var(--muted);font-size:.86rem;min-height:46px}
.panel{padding:17px}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--edge);gap:7px}
#status{font-size:.76rem;background:var(--tint);color:var(--accent);border-radius:3px;padding:4px 7px;font-weight:700}
#message{font-size:.86rem;color:var(--muted);min-height:2.8em;margin:12px 0}
.steps{display:grid;gap:7px}
.step{display:grid;grid-template-columns:25px 1fr 17px;align-items:center;gap:8px;text-align:left;border-radius:5px;border:1px solid var(--edge);padding:10px 9px;background:#eff2ec;font-weight:700}
.step span:first-child,.symbol{font-family:Bahnschrift,sans-serif;font-size:.86rem;text-align:center}
.step:disabled{color:#59675f}
.step.active{background:var(--accent);color:white;border-color:var(--accent)}
.step.active:hover{background:#236252}
.step.complete{background:var(--tint);color:var(--accent)}
.ledger{margin-top:14px;padding-top:12px;border-top:1px solid var(--edge);display:grid;grid-template-columns:1fr 1fr}
.ledger div+div{padding-left:12px;border-left:1px solid var(--edge)}
.ledger span{display:block;color:var(--muted);font-size:.76rem}
output{font:1.55rem Bahnschrift,sans-serif}
.utility{border:1px solid #aebeb2;background:transparent;border-radius:4px;font-size:.84rem;padding:6px 10px}
@media(max-width:800px){.dashboard{grid-template-columns:minmax(0,1fr)}.stage{height:clamp(340px,85vw,500px);min-height:0}.steps{grid-template-columns:1fr 1fr}#message{min-height:0}}
@media(max-width:380px){.views button{font-size:.79rem}}
</style>
</head>
<body>
<header><div><span class="brand">MEDIFLOW</span><a href="./mediflow.glb" download>下載 GLB 模型 ↓</a></div></header>
<main>
<h1>膠囊分藥機 3D</h1>
<div class="dashboard">
<section class="viewer" aria-label="互動 3D 機件">
<div class="stage" id="stage">
<div class="hotspots" id="hotspots" aria-label="可點擊機件"></div>
<div class="hud"><span>點機件操作 · 拖曳旋轉</span><button id="cover" type="button" aria-pressed="false" disabled>隱藏透明護罩</button></div>
<div class="zoom" aria-label="相機高度與縮放"><button class="height" id="down" type="button" aria-label="降低相機高度">↓ 下移</button><button class="height" id="up" type="button" aria-label="提高相機高度">↑ 上移</button><button id="minus" type="button" aria-label="縮小">−</button><button id="plus" type="button" aria-label="放大">+</button></div>
<p id="loading" role="status">正在載入 3D 模型…</p>
</div>
<nav class="views" aria-label="機件視角">
<button data-view="home" aria-pressed="true" type="button">全機</button>
<button data-view="feed" aria-pressed="false" type="button">料斗轉盤</button>
<button data-view="scan" aria-pressed="false" type="button">光學檢測</button>
<button data-view="tray" aria-pressed="false" type="button">回藥與取藥</button>
</nav>
<div class="caption" id="detail" role="status">點轉盤、檢測室、出藥口、取藥碟或抽屜操作。</div>
</section>
<aside class="panel" aria-label="操作面板">
<div class="panel-head"><h2>操作面板</h2><span id="status">載入中</span></div>
<p id="message" role="status">模型載入後可啟動進料。</p>
<div class="steps">
<button class="step" data-step="0" type="button" disabled><span>01</span><span>啟動進料</span><span class="symbol"></span></button>
<button class="step" data-step="1" type="button" disabled><span>02</span><span>開始掃描</span><span class="symbol"></span></button>
<button class="step" data-step="2" type="button" disabled><span>03</span><span>送出膠囊</span><span class="symbol"></span></button>
<button class="step" data-step="3" type="button" disabled><span>04</span><span>取走膠囊</span><span class="symbol"></span></button>
</div>
<div class="ledger"><div><span>待取膠囊</span><output id="waiting">0</output></div><div><span>已取膠囊</span><output id="collected">0</output></div></div>
<button id="reset" class="utility" type="button" style="margin-top:10px" disabled>重設操作與視角</button>
</aside>
</div>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
